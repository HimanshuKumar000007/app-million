name: Build Test APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Save APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: iiser-smart-prep-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to the easy-download release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk iiser-smart-prep.apk
          gh release view apk-latest >/dev/null 2>&1 || gh release create apk-latest --title "IISER Smart Prep - latest test APK" --notes "Always the newest build of the app. Download iiser-smart-prep.apk below and install it on the phone. Rebuilt automatically on every update." --prerelease
          gh release upload apk-latest iiser-smart-prep.apk --clobber
-
